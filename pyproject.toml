[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sfr-mcp"
version = "0.1.0"
description = "Stratified Pure-TDD Sodium Fast Reactor Physics Engine"
dependencies = [
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
